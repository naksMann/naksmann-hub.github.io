<!DOCTYPE html>

        <link rel="stylesheet" href="assets/css/styles.css">
        <title>Certifications | Nakedi Tumelo Peta</title>
    </head>
    <body>
        <!-- OVERLAY -->
        <div class="overlay first"></div>
        <div class="overlay second"></div>
        <div class="overlay third"></div>

        <!-- HEADER -->
        <header class="l-header">
            <nav class="nav bd-grid">
                <div>
                    <a href="index.html" class="nav__logo">Nakedi Peta</a>
                </div>

                <div class="nav__menu" id="nav-menu">
                    <ul class="nav__list">
                        <li class="nav__item"><a href="index.html#home" class="nav__link">Home</a></li>
                        <li class="nav__item"><a href="about.html" class="nav__link">About</a></li>
                        <li class="nav__item"><a href="projects.html" class="nav__link">Projects</a></li>
                        <li class="nav__item"><a href="certifications.html" class="nav__link">Certifications</a></li>
                        <li class="nav__item"><a href="assets/resume/Nakedi_Peta_CV_JuniorCyberAnalyst.pdf" class="nav__link" target="_blank" rel="noopener">CV</a></li>
                        <li class="nav__item"><a href="contact.html" class="nav__link">Contact</a></li>
                    </ul>
                </div>

                <div class="nav__toggle" id="nav-toggle">
                    <ion-icon name="menu"></ion-icon>
                </div>
            </nav>
        </header>

        <!-- CERTIFICATIONS -->
        <main>
            <section class="certs" id="certifications">
                <div class="bd-grid">
                    <h1 class="certs__title">Certifications</h1>
                    <p class="certs__intro">
                        Training completed and in progress. Select any earned certificate to read it.
                    </p>

                    <!-- Cards are rendered here by assets/js/main.js -->
                    <div class="certs__grid" id="certs-grid"></div>
                </div>
            </section>
        </main>

        <!-- FOOTER -->
        <footer class="footer">
            <div class="bd-grid footer__inner">
                <p class="footer__text">Nakedi Tumelo Peta &middot; Cyber Security Analyst</p>
                <div class="footer__social">
                    <a href="https://www.linkedin.com/in/nakedi-tumelo-peta-30045b381" class="footer__link" target="_blank" rel="noopener noreferrer" title="LinkedIn" aria-label="LinkedIn profile">
                        <ion-icon name="logo-linkedin"></ion-icon>
                    </a>
                    <a href="https://github.com/naksMann" class="footer__link" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub profile">
                        <ion-icon name="logo-github"></ion-icon>
                    </a>
                    <a href="https://tryhackme.com/room/mwrcybersecvirtualintershipcapstone" class="footer__link" target="_blank" rel="noopener noreferrer" title="TryHackMe: MWR CyberSec capstone" aria-label="MWR CyberSec capstone room on TryHackMe">
                        <ion-icon name="flag"></ion-icon>
                    </a>
                    <a href="mailto:makgwatatumelo46@gmail.com" class="footer__link" title="Email" aria-label="Email me">
                        <ion-icon name="mail"></ion-icon>
                    </a>
                </div>
            </div>
        </footer>

        <!-- DETAIL MODAL (shared with projects.html) -->
        <div class="modal" id="project-modal" hidden>
            <div class="modal__backdrop" data-close-modal></div>

            <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
                <button class="modal__close" type="button" data-close-modal aria-label="Close">
                    <ion-icon name="close"></ion-icon>
                </button>

                <div class="modal__scroll">
                    <span class="modal__subtitle" id="modal-subtitle"></span>
                    <h2 class="modal__title" id="modal-title"></h2>
                    <div class="modal__tags" id="modal-tags"></div>
                    <div class="modal__body" id="modal-body"></div>

                    <div class="modal__section" id="modal-video-section" hidden>
                        <h3 class="modal__section-title">Walkthrough</h3>
                        <div class="modal__video"><iframe id="modal-video" title="Walkthrough video" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
                    </div>

                    <div class="modal__section" id="modal-docs-section">
                        <h3 class="modal__section-title">Certificate</h3>
                        <div class="modal__doc-tabs" id="modal-doc-tabs"></div>
                        <div class="modal__viewer">
                            <iframe id="modal-doc-frame" title="Certificate"></iframe>
                        </div>
                        <a class="modal__doc-open" id="modal-doc-open" href="#" target="_blank" rel="noopener">
                            <ion-icon name="document-text"></ion-icon>
                            Open the full certificate
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- GSAP -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.2.4/gsap.min.js"></script>

        <!-- DATA + MAIN (icons are drawn inline by main.js) -->
        <script src="assets/js/certs.js"></script>
        <script src="assets/js/main.js"></script>

</html>
