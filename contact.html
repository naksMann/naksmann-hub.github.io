        <!-- CONTACT -->
        <main>
            <section class="contact" id="contact">
                <div class="bd-grid">
                    <h1 class="contact__title">Contact Me</h1>

                    <div class="contact__container">
                        <!-- DETAILS -->
                        <div class="contact__info">
                            <a class="contact__item" href="mailto:makgwatatumelo46@gmail.com">
                                <span class="contact__icon"><ion-icon name="mail"></ion-icon></span>
                                <span>makgwatatumelo46@gmail.com</span>
                            </a>

                            <a class="contact__item" href="tel:+27633111040">
                                <span class="contact__icon"><ion-icon name="call"></ion-icon></span>
                                <span>+27 63 311 1040</span>
                            </a>

                            <p class="contact__item">
                                <span class="contact__icon"><ion-icon name="location"></ion-icon></span>
                                <span>Centurion, Gauteng, South Africa</span>
                            </p>

                            <p class="contact__item">
                                <span class="contact__icon"><ion-icon name="time"></ion-icon></span>
                                <span>Open to opportunities, available to relocate</span>
                            </p>

                            <div class="contact__social">
                                <a href="https://www.linkedin.com/in/nakedi-tumelo-peta-30045b381" class="contact__social-link" target="_blank" rel="noopener noreferrer" title="LinkedIn" aria-label="LinkedIn profile">
                                    <ion-icon name="logo-linkedin"></ion-icon>
                                </a>
                                <a href="https://github.com/naksMann" class="contact__social-link" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub profile">
                                    <ion-icon name="logo-github"></ion-icon>
                                </a>
                                <a href="https://tryhackme.com/room/mwrcybersecvirtualintershipcapstone" class="contact__social-link" target="_blank" rel="noopener noreferrer" title="TryHackMe: MWR CyberSec capstone" aria-label="MWR CyberSec capstone room on TryHackMe">
                                    <ion-icon name="flag"></ion-icon>
                                </a>
                                <a href="https://wa.me/27633111040" class="contact__social-link" target="_blank" rel="noopener noreferrer" title="WhatsApp" aria-label="Message me on WhatsApp">
                                    <ion-icon name="logo-whatsapp"></ion-icon>
                                </a>
                            </div>
                        </div>

                        <!-- FORM -->
                        <!-- Delivery is handled by Web3Forms, because GitHub Pages
                             serves static files only and cannot send mail itself.
                             SETUP: get a free access key at https://web3forms.com
                             (enter your email, they send the key), then paste it
                             into the access_key value below. Until you do, the form
                             falls back to opening the visitor's email app. -->
                        <form class="contact__form" id="contact-form"
                              action="https://api.web3forms.com/submit" method="POST" novalidate>

                            <input type="hidden" name="access_key" id="contact-key"
                                   value="PASTE_YOUR_WEB3FORMS_ACCESS_KEY_HERE">
                            <input type="hidden" name="subject" value="New message from your portfolio">
                            <input type="hidden" name="from_name" value="Portfolio contact form">

                            <!-- Honeypot. Hidden from people and from screen readers,
                                 so anything that fills it in is a bot. -->
                            <input type="checkbox" name="botcheck" class="contact__botcheck"
                                   tabindex="-1" autocomplete="off" aria-hidden="true">

                            <div class="contact__field">
                                <label class="sr-only" for="contact-name">Your name</label>
                                <input class="contact__input" type="text" id="contact-name" name="name"
                                       placeholder="Name" autocomplete="name" required>
                            </div>

                            <div class="contact__field">
                                <label class="sr-only" for="contact-email">Your email address</label>
                                <input class="contact__input" type="email" id="contact-email" name="email"
                                       placeholder="Email" autocomplete="email" required>
                            </div>

                            <div class="contact__field">
                                <label class="sr-only" for="contact-message">Your message</label>
                                <textarea class="contact__input contact__textarea" id="contact-message" name="message"
                                          placeholder="Message" rows="7" required></textarea>
                            </div>

                            <p class="contact__status" id="contact-status" role="status" aria-live="polite"></p>

                            <button class="contact__submit" type="submit">Send Message</button>
                        </form>
                    </div>
                </div>
            </section>
        </main>

        <!-- FOOTER -->
        <footer class="footer">
            <div class="bd-grid footer__inner">

                        <ion-icon name="logo-linkedin"></ion-icon>
                    </a>
                    <a href="https://github.com/naksMann" class="footer__link" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub profile">
                        <ion-icon name="logo-github"></ion-icon>
                    </a>
                    <a href="https://tryhackme.com/room/mwrcybersecvirtualintershipcapstone" class="footer__link" target="_blank" rel="noopener noreferrer" title="TryHackMe: MWR CyberSec capstone" aria-label="MWR CyberSec capstone room on TryHackMe">
                        <ion-icon name="flag"></ion-icon>
                    </a>
                    <a href="mailto:makgwatatumelo46@gmail.com" class="footer__link" title="Email" aria-label="Email me">
                        <ion-icon name="mail"></ion-icon>
                    </a>
                </div>
            </div>
        </footer>

</html>
